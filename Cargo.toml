[package]
name = "autotext"
version = "1.0.1"
edition = "2024"
description = "AutoText - 핫키로 상용구를 입력하는 Windows 트레이 프로그램"

[[bin]]
name = "AutoText"
path = "src/main.rs"

[dependencies]
eframe = "0.37.0"
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Registry", "Win32_Networking_WinHttp"] }

[build-dependencies]
winresource = "0.1.34"

[package.metadata.winresource]
ProductName = "AutoText"
FileDescription = "AutoText"
LegalCopyright = "Copyright (c) 2026"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
